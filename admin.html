<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Moderação — TIZIU HUB</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css">
<style>body{padding:30px 5%}.arow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.arow p{margin:6px 0;white-space:pre-wrap;word-break:break-word}.arow .btn{padding:8px 14px;margin:4px 6px 0 0}.st{font-size:.8rem;font-weight:800;color:var(--gold)}input{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff}</style></head>
<body><h2 style="margin:0 0 18px;border-left:4px solid var(--gold);padding-left:12px">MODERAÇÃO DE AVALIAÇÕES</h2>
<p><input id="tk" type="password" placeholder="Token de administrador" autocomplete="off"> <button class="btn btn-gold" id="go">ENTRAR</button> <a class="btn btn-line" href="/">VOLTAR À LOJA</a></p>
<p id="msg" style="color:var(--gold)"></p><div id="list"></div>
<script>
const $=s=>document.querySelector(s);let T='';
async function call(p,o={}){const r=await fetch(p,{...o,headers:{'Authorization':'Bearer '+T,'Content-Type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d}
async function load(){try{const d=await call('/api/admin/reviews');$('#msg').textContent=d.reviews.length+' avaliação(ões).';render(d.reviews)}catch(e){$('#msg').textContent=e.message;$('#list').textContent=''}}
function render(a){const L=$('#list');L.textContent='';const lab={pending:'PENDENTE',approved:'PUBLICADA',rejected:'REJEITADA'};
a.forEach(r=>{const d=document.createElement('div');d.className='arow';
const h=document.createElement('div');h.innerHTML='<span class="st"></span> · <b></b> · <span></span> · <small></small>';
h.children[0].textContent=lab[r.status]||r.status;h.children[1].textContent=r.name;h.children[2].textContent='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);h.children[3].textContent=new Date(r.createdAt).toLocaleString('pt-BR');
const p=document.createElement('p');p.textContent=r.comment;d.append(h,p);
[['approve','APROVAR','btn-gold'],['reject','REJEITAR','btn-line'],['delete','EXCLUIR','btn-line']].forEach(([ac,tx,cl])=>{const b=document.createElement('button');b.className='btn '+cl;b.textContent=tx;
b.onclick=async()=>{if(ac==='delete'&&!confirm('Excluir definitivamente?'))return;try{await call('/api/admin/reviews/'+r.id,{method:'POST',body:JSON.stringify({action:ac})});load()}catch(e){$('#msg').textContent=e.message}};d.append(b)});L.append(d)})}
$('#go').onclick=()=>{T=$('#tk').value;load()};
</script></body></html>
